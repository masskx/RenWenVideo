<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>哲理视频 · 单页预览</title>
  <style>
    :root{--bg:#09130e;--panel:#102018;--panel2:#142a1e;--line:#274635;--text:#f1efe4;--muted:#91a397;--gold:#d6b77a;--green:#8dce91;--red:#df8989;--radius:18px}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 12% 0,#173524 0,transparent 32%),var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",sans-serif;min-height:100vh}
    .shell{max-width:1280px;margin:0 auto;padding:32px 24px 54px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:24px}.kicker{font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:700}.brand{font-size:30px;font-weight:700;letter-spacing:.04em;margin:8px 0}.intro{color:var(--muted);font-size:14px;line-height:1.8;max-width:600px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px 16px;border-radius:12px;font:inherit;cursor:pointer;transition:.2s}.btn:hover{border-color:var(--gold);background:var(--panel2)}.btn.primary{background:var(--gold);color:#1d2114;border-color:var(--gold);font-weight:700}.btn.ghost{color:var(--muted)}
    .notice{display:flex;align-items:center;gap:10px;padding:13px 16px;background:rgba(214,183,122,.09);border:1px solid rgba(214,183,122,.28);border-radius:12px;color:#dfd4ba;font-size:13px;margin-bottom:20px}.notice strong{color:var(--gold)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.stat{padding:18px;background:rgba(16,32,24,.82);border:1px solid var(--line);border-radius:14px}.stat b{display:block;color:var(--text);font-size:26px}.stat span{display:block;margin-top:4px;color:var(--muted);font-size:12px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:24px 0 14px}.toolbar h2{font-size:19px;margin:0}.toolbar-right{display:flex;align-items:center;gap:10px}.search{width:240px;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:16px}.card{background:rgba(16,32,24,.9);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.12)}.video-wrap{background:#000;aspect-ratio:9/16;position:relative}.video-wrap video{display:block;width:100%;height:100%;object-fit:cover}.card-body{padding:14px 15px 16px}.card-title{font-weight:700;font-size:17px;display:flex;justify-content:space-between;gap:8px}.card-title span{font-weight:400;color:var(--green);font-size:12px}.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:8px}.filename{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c2cec2;font-size:12px;margin-top:10px}.empty{padding:70px 24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);background:rgba(16,32,24,.45)}.empty .icon{font-size:42px;margin-bottom:10px}.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}.empty p{margin:0;line-height:1.8;font-size:13px}.footer{margin-top:26px;color:#63776a;font-size:11px;line-height:1.8}.hidden{display:none!important}
    @media(max-width:760px){.shell{padding:22px 14px 40px}.top{align-items:flex-start;flex-direction:column}.brand{font-size:25px}.stats{grid-template-columns:repeat(2,1fr)}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card-body{padding:11px}.card-title{font-size:14px}.meta{font-size:10px;gap:6px}.filename{font-size:10px}}
    @media(max-width:420px){.grid{grid-template-columns:1fr}.video-wrap{max-height:540px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><div class="kicker">ZEN VIDEO · LOCAL PREVIEW</div><div class="brand">🍵 哲理视频单页预览</div><div class="intro">双击打开即可使用，不需要启动前端服务。选择当前项目的 <b>out</b> 文件夹，就能直接查看和播放已经导出的 MP4。</div></div>
      <div class="actions"><button class="btn primary" id="pickFolder">选择 out 文件夹</button><button class="btn ghost" id="pickFiles">选择视频文件</button><button class="btn ghost hidden" id="clear">清空</button></div>
    </header>
    <div class="notice"><span>●</span><span><strong id="folderName">尚未选择文件夹</strong>　页面只读取你主动选择的本地视频，不上传任何文件。</span></div>
    <section class="stats"><div class="stat"><b id="count">0</b><span>视频产物</span></div><div class="stat"><b id="totalSize">0 MB</b><span>文件总大小</span></div><div class="stat"><b id="withAudio">0</b><span>有声成片</span></div><div class="stat"><b id="lastName">—</b><span>最近加载</span></div></section>
    <section class="toolbar"><h2>当前视频产物</h2><div class="toolbar-right"><input class="search" id="search" placeholder="搜索文件名或标题…" aria-label="搜索视频"></div></section>
    <section id="grid" class="grid"></section>
    <section id="empty" class="empty"><div class="icon">🎬</div><b>还没有加载视频</b><p>点击“选择 out 文件夹”，选择 <code>zen-video\out</code>。<br>如果浏览器不支持文件夹选择，也可以直接选择多个 MP4。</p></section>
    <footer class="footer">本页面是独立静态 HTML，仅用于预览视频产物。正式制作仍通过项目脚本和 Zen Video Maker Skill 完成。</footer>
    <input id="folderInput" type="file" webkitdirectory directory multiple accept="video/*" class="hidden">
    <input id="fileInput" type="file" multiple accept="video/mp4,video/webm,video/quicktime" class="hidden">
  </main>
  <script>
    (()=>{
      const state={items:[],urls:[],label:''};
      const $=(id)=>document.getElementById(id);
      const formatSize=(bytes)=>bytes<1048576?(bytes/1024).toFixed(0)+' KB':(bytes/1048576).toFixed(1)+' MB';
      const titleOf=(name)=>name.replace(/\.(mp4|webm|mov)$/i,'').replace(/-silent|-draft/g,'').replace(/[-_]/g,' ');
      const escapeHtml=(value)=>String(value).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      function load(files,label){
        state.urls.forEach((url)=>URL.revokeObjectURL(url)); state.urls=[];
        state.items=Array.from(files).filter((file)=>/\.(mp4|webm|mov)$/i.test(file.name)).sort((a,b)=>b.lastModified-a.lastModified||a.name.localeCompare(b.name)); state.label=label||'已选择视频文件';
        render();
      }
      function render(){
        state.urls.forEach((url)=>URL.revokeObjectURL(url)); state.urls=[];
        const query=$('search').value.trim().toLowerCase(); const items=state.items.filter((file)=>file.name.toLowerCase().includes(query)); const grid=$('grid');
        grid.innerHTML=''; $('empty').classList.toggle('hidden',items.length>0); $('clear').classList.toggle('hidden',state.items.length===0); $('folderName').textContent=state.label||'尚未选择文件夹'; $('count').textContent=state.items.length; $('totalSize').textContent=formatSize(state.items.reduce((sum,file)=>sum+file.size,0)); $('withAudio').textContent=state.items.filter((file)=>!/-silent(?:-draft)?\.mp4$/i.test(file.name)).length; $('lastName').textContent=state.items[0]?titleOf(state.items[0].name):'—';
        for(const file of items){const url=URL.createObjectURL(file);state.urls.push(url);const card=document.createElement('article');card.className='card';card.innerHTML='<div class="video-wrap"><video controls preload="metadata" playsinline src="'+url+'"></video></div><div class="card-body"><div class="card-title"><span>'+escapeHtml(titleOf(file.name))+'</span><span>'+formatSize(file.size)+'</span></div><div class="meta"><span>📅 '+new Date(file.lastModified).toLocaleDateString('zh-CN')+'</span><span>▶ 可播放</span></div><div class="filename" title="'+escapeHtml(file.name)+'">'+escapeHtml(file.name)+'</div></div>';grid.appendChild(card)}
      }
      async function pickFolder(){
        if(window.showDirectoryPicker){try{const root=await window.showDirectoryPicker({mode:'read'});let dir=root;try{dir=await root.getDirectoryHandle('out')}catch{}const files=[];for await(const entry of dir.values()){if(entry.kind==='file'&&/\.(mp4|webm|mov)$/i.test(entry.name))files.push(await entry.getFile())}load(files,root.name+(dir!==root?' / out':''));return}catch(error){if(error.name==='AbortError')return}}
        $('folderInput').click();
      }
      $('pickFolder').addEventListener('click',pickFolder); $('pickFiles').addEventListener('click',()=>$('fileInput').click()); $('folderInput').addEventListener('change',(event)=>load(event.target.files,'已选择文件夹')); $('fileInput').addEventListener('change',(event)=>load(event.target.files,'已选择视频文件')); $('search').addEventListener('input',render); $('clear').addEventListener('click',()=>{state.items=[];state.label='';render()});
    })();
  </script>
</body>
</html>
