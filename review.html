<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>独处 · 画面复刻对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e1915;color:#e9e9da;font-family:'Microsoft YaHei',sans-serif;padding:36px}main{max-width:1040px;margin:auto}h1{font-family:KaiTi,serif;font-size:36px;margin:0 0 12px}p{color:#a6b5aa;line-height:1.8;font-size:14px}section{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}video{display:block;width:100%;max-height:70vh;background:#000;border-radius:8px}figcaption{margin:14px 0;font-size:14px}button{background:#dfe6d6;color:#17271b;border:0;padding:12px 20px;margin:10px 10px 24px 0;border-radius:4px;cursor:pointer}.note{border-top:1px solid #33463a;padding-top:14px}@media(max-width:640px){body{padding:18px}section{gap:10px}h1{font-size:28px}}
</style>
<main><h1>独处 · 画面复刻对照</h1>
<p>33.48 秒 / 14 镜头 / 25 fps　·　右侧为新生图素材＋Remotion 运镜的静音版本</p>
<button id="play">从头同步播放</button><button id="pause">全部暂停</button>
<section><figure><video id="reference" src="../目标视频.mp4" controls muted playsinline></video><figcaption>参考片 · 720×1280</figcaption></figure><figure><video id="replica" src="out/solitude-silent.mp4" controls muted playsinline></video><figcaption>Remotion 样片 · 1080×1920 输出</figcaption></figure></section>
<p class="note">比较重点：标题与字幕位置、镜头次序、停留时间、整体色调。右侧只有图片推拉，没有真实的流水、倒茶和鱼游动。图片实际为 941×1672，渲染时轻微放大。左右均默认静音。</p>
<p>在本机浏览器打开此文件即可比较。先完成 npm run render；导出路径改变后需更新右侧视频地址。</p></main>
<script>
const videos=[document.querySelector('#reference'),document.querySelector('#replica')];
document.querySelector('#play').onclick=async()=>{for(const video of videos)video.currentTime=0;await Promise.allSettled(videos.map(video=>video.play()));};
document.querySelector('#pause').onclick=()=>videos.forEach(video=>video.pause());
</script>
</html>
