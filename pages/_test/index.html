<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Harness smoke test: a WebGL-free Canvas 2D frame as a pure function of t.
window.DEMO = {width: 1080, height: 1920, fps: 30, duration: 2};
const c = document.getElementById('c'), x = c.getContext('2d');
window.renderAt = async (t) => {
  x.fillStyle = '#101418'; x.fillRect(0, 0, 1080, 1920);
  x.fillStyle = '#ffc53d'; x.beginPath(); x.arc(540 + 300 * Math.sin(t * 3), 960, 120, 0, 7); x.fill();
  x.fillStyle = '#fff'; x.font = '900 120px sans-serif'; x.fillText(t.toFixed(2), 360, 400);
};
window.__ready = true;
</script>
